# Runs the same verification loop that runs locally after every change (notes/handover.md §4).
# What is green here is green locally -- and the other way around.
#
# The predecessor workflow only built Docker images for the k8s deployment that has been switched off,
# and went away with 4e15012; nothing was ever tested or linted (notes/plan.md 5.3).
name: checks

# Every push on every branch, exactly one run. No `pull_request` trigger: for a PR from this
# repository the result hangs off the commit anyway and shows up on the PR, and both triggers together
# would mean two runs per push. For PRs from a fork it would have to be added.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Everything heavy (Python, Django, pytest, ruff) comes from cache.nixos.org -- only the
    # withPackages symlink join is built. If this takes longer, something else is broken.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          # Explicit, rather than relying on the action's default.
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: nix flake check
        run: nix flake check -L

      - name: ruff format
        run: nix develop --command ruff format --check .

      - name: ruff check
        run: nix develop --command ruff check .

      # `--fail-level WARNING`, because otherwise `check` exits with 0 on a `Warning` (review R9-2):
      # the hardening check from demockrazy/checks.py would have been printed and without consequence,
      # so exactly the silent misconfiguration it is built against. Making it an `Error` would be the
      # alternative -- but that would also refuse to start the service in production, and that is an
      # operational decision for the user (notes/to-check.md D2).
      - name: django check
        run: nix develop --command python3 manage.py check --fail-level WARNING

      - name: migrations are complete
        run: nix develop --command python3 manage.py makemigrations --check --dry-run

      - name: pytest
        run: nix develop --command pytest
